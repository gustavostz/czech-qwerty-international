<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 972 464" width="972" height="464" role="img" aria-label="Czech QWERTY International keyboard layout">
<style>
  svg { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
  .bg { fill: #ffffff; }
  .key { fill: #f4f4f5; stroke: #d4d4d8; }
  .mod { fill: #e4e4e7; }
  .czech-key { fill: #dbeafe; stroke: #93c5fd; }
  .accent-key { fill: #dbeafe; stroke: #3b82f6; }
  .title { fill: #18181b; font-weight: 600; }
  .main { fill: #18181b; }
  .muted { fill: #52525b; }
  .altgr { fill: #52525b; }
  .czech { fill: #1d4ed8; font-weight: 700; }
  .accent { fill: #1d4ed8; font-weight: 600; }
  .dead { fill: #c2410c; font-weight: 700; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #18181b; }
    .key { fill: #27272a; stroke: #3f3f46; }
    .mod { fill: #1f1f23; }
    .czech-key { fill: #1e3a8a; stroke: #3b82f6; }
    .accent-key { fill: #1e3a8a; stroke: #60a5fa; }
    .title, .main { fill: #fafafa; }
    .muted, .altgr { fill: #a1a1aa; }
    .czech, .accent { fill: #bfdbfe; }
    .dead { fill: #fb923c; }
  }
</style>
<rect width="100%" height="100%" class="bg"/>
<text x="24" y="38" font-size="22" class="title" text-anchor="start">Czech QWERTY International</text>
<text x="24" y="60" font-size="14" class="muted" text-anchor="start">US-International with Czech letters on AltGr: &#39; + a → á, AltGr + c → č, AltGr + u → ů.</text>
